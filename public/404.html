<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Studio Ghibli App</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      var segment = 1;
      var l = window.location;
      var pathSegments = l.pathname.split('/');
      var repoName = pathSegments[1];
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + repoName + '/?p=/' + pathSegments.slice(2).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') + l.hash
      );
    </script>
  </head>

  </body>
</html>
